  big 4) rises slowly to the rafters on its wires. It locks in next to the other banners: confetti, flashes, the
  crowd goes up, and Dylan throws both arms up.
  Beats (30 fps): lights 6, salute 14, rise 18-74, lock 76, champ 80, card 120.
-->

</head>
<body>

 <div id="rt-scene" class="clip" data-start="0" data-duration="5.5" data-track-index="0" style="position:absolute;inset:0;overflow:hidden;background:#151229">

 <div id="card" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="4.0" data-duration="1.5" data-track-index="2" data-width="1080" data-height="2348"
      data-variable-values='{"title":"RETIRE THE|NUMBER","pts":"4","unit":"PTS","sub":"LA4 FOREVER","color":"#1FA3A0","dark":"#136E6C","light":"#C9F2F0"}'></div>
</div>
<script>
(function () {
  var F = WA.F, tl = gsap.timeline({ paused: true }), r = WA.rng(4);
  // the crowd: rows of heads and shoulders
  var cols = ['#5A4E8A', '#8A4E5A', '#3E6E8A', '#6E8A4E', '#8A6E3E', '#4E8A7A'], skins = ['#F0B98F', '#C98B5E', '#8D5A3B', '#F2C6A0'], h = '';
  for (var row = 0; row < 5; row++) {
    for (var c = 0; c < 9; c++) {
      var x = 30 + c * 128 + (row % 2) * 64 + (r() - 0.5) * 20, y = 1380 + row * 120;
      h += '<path d="M' + (x - 50) + ' ' + (y + 90) + ' Q' + (x - 50) + ' ' + (y + 30) + ' ' + x + ' ' + (y + 30) + ' Q' + (x + 50) + ' ' + (y + 30) + ' ' + (x + 50) + ' ' + (y + 90) + ' Z" fill="' + cols[(row * 9 + c) % 6] + '" stroke="#341720" stroke-width="6" opacity=".85"/>' +
           '<circle cx="' + x + '" cy="' + y + '" r="30" fill="' + skins[(row + c) % 4] + '" stroke="#341720" stroke-width="6" opacity=".85"/>';
    }
  }
  document.getElementById('rt-crowd').innerHTML = h;

  WA.actor('rt-dylan', ['grin', 'salute', 'champ'], { x: 540, y: 2170, s: 0.62, member: 'dylan', tag: 'DYLAN', color: '#1FA3A0' });
  WA.pose(tl, '#rt-dylan', 'grin', 0);
  gsap.set('#rt-dylan', { filter: 'brightness(0.55)' });

  // lights on
  tl.set(['#rt-b0', '#rt-b1'], { opacity: 0.22 }, 6 * F);
  tl.set('#rt-pool', { opacity: 0.35 }, 6 * F);
  tl.set('#rt-dylan', { filter: 'brightness(1)' }, 6 * F);
  WA.word(tl, '#rt-clunk', 6 * F, 20, { rot: -4, rot0: 8, seed: 1, amp: 3 });
  WA.take(tl, '#rt-dylan', 'salute', 14 * F, 0.08);

  // up it goes, slowly, on its wires
  gsap.set('#rt-jersey', { y: 1300 });
  tl.to('#rt-jersey', { y: 760, duration: 60 * F, ease: 'power1.inOut' }, 14 * F);
  tl.fromTo('#rt-jersey svg', { rotation: -2 }, { rotation: 2, duration: 14 * F, ease: 'sine.inOut', yoyo: true, repeat: 3, immediateRender: false }, 18 * F);
  // locked in
  WA.squash(tl, '#rt-jersey svg', 76 * F, 0.12, 12);
  gsap.set('#rt-jersey svg', { transformOrigin: '200px 1400px' });
  WA.shake(tl, '#rt-scene', 76 * F, 8 * F, 8, { seed: 4, decay: true });
  WA.confetti(tl, '#rt-conf', 76 * F, 540, 760, { n: 46, seed: 3, speed: 30, spread: 1.4, frames: 44, colors: ['#1FA3A0', '#FFFFFF', '#FFD064', '#C9F2F0'] });
  WA.confetti(tl, '#rt-conf', 82 * F, 200, 1300, { n: 24, seed: 8, speed: 28, angle: -1.2, spread: 0.6, frames: 40, colors: ['#1FA3A0', '#FFFFFF', '#FFD064'] });
  WA.confetti(tl, '#rt-conf', 82 * F, 880, 1300, { n: 24, seed: 9, speed: 28, angle: -1.9, spread: 0.6, frames: 40, colors: ['#1FA3A0', '#FFFFFF', '#FFD064'] });
  WA.take(tl, '#rt-dylan', 'champ', 80 * F, 0.12);
  WA.hop(tl, '#rt-dylan', 82 * F, 40, 10);
  // the crowd: flashes, a bounce
  [[78, 0], [84, 2], [88, 1], [93, 4], [98, 3], [104, 0], [108, 2], [112, 1]].forEach(function (k) {
    tl.fromTo('#rt-f' + k[1], { opacity: 1, scale: 0.4 }, { opacity: 0, scale: 1.4, duration: 6 * F, ease: 'power2.out', immediateRender: false }, k[0] * F);
  });
  tl.fromTo('#rt-crowd', { y: 0 }, { y: -14, duration: 5 * F, ease: 'sine.inOut', yoyo: true, repeat: 7, immediateRender: false }, 78 * F);

  window.__timelines['joke-retire'] = tl;
})();
</script>
