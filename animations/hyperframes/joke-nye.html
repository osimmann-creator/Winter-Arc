  drops and THUDS into the street, cracking it, and confetti flies. Beats (30 fps): 3 at 8, 2 at 28, 1 at 48,
  drop 60-72, THUD 72, confetti + fireworks 74-110, card 120.
-->

</style>
</head>
<body>

 <div id="ny-scene" class="clip" data-start="0" data-duration="5.5" data-track-index="0" style="position:absolute;inset:0;overflow:hidden;background:#141233">

    <g fill="#FFE9A0" stroke="#341720" stroke-width="5">
      <rect x="20" y="1240" width="50" height="60"/><rect x="110" y="1240" width="50" height="60"/><rect x="20" y="1360" width="50" height="60"/><rect x="110" y="1480" width="50" height="60"/>

  <div class="ny-num" id="ny-n2"><svg width="400" height="400" viewBox="-200 -200 400 400"><text x="0" y="110" text-anchor="middle" font-family="Luckiest Guy" font-size="330" fill="#FFD064" stroke="#341720" stroke-width="18" paint-order="stroke">2</text></svg></div>

 <div id="card" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="4.0" data-duration="1.5" data-track-index="2" data-width="1080" data-height="2348"

</div>
<script>
(function () {
  var F = WA.F, tl = gsap.timeline({ paused: true });
  // the crowd: a row of heads and shoulders along the bottom
  var crowd = document.getElementById('ny-crowd'), cols = ['#2B2236', '#3A2E4A', '#241D30'];
  for (var i = 0; i < 9; i++) {
    var h = document.createElement('div'); h.className = 'abs ny-head';
    h.style.left = (i * 128 - 40) + 'px'; h.style.top = (2130 + (i % 2) * 40) + 'px';
    h.innerHTML = '<svg width="190" height="260" viewBox="0 0 190 260" style="overflow:visible"><path d="M10 260 Q10 150 95 150 Q180 150 180 260 Z" fill="' + cols[i % 3] + '" stroke="#341720" stroke-width="8"/><circle cx="95" cy="100" r="62" fill="' + cols[(i + 1) % 3] + '" stroke="#341720" stroke-width="8"/>' +
      (i % 3 === 1 ? '<path d="M60 52 L95 -10 L130 52 Z" fill="#FFD064" stroke="#341720" stroke-width="6"/>' : '') + '</svg>';
    crowd.appendChild(h);
    tl.fromTo(h, { y: 0 }, { y: -18, duration: (8 + (i % 3) * 2) * F, yoyo: true, repeat: 3, ease: 'sine.inOut' }, (i % 4) * 2 * F);
    tl.to(h, { y: -60, duration: 5 * F, yoyo: true, repeat: 5, ease: 'power1.out' }, (74 + (i % 3) * 2) * F);
  }
  // the kettlebell sways at the top of the mast
  tl.fromTo('#ny-kb', { rotation: -4 }, { rotation: 4, duration: 12 * F, yoyo: true, repeat: 4, ease: 'sine.inOut' }, 0);
  // 3... 2... 1...
  [['#ny-n3', 8], ['#ny-n2', 28], ['#ny-n1', 48]].forEach(function (n) {
    tl.fromTo(n[0], { scale: 0.2, opacity: 1, rotation: -12 }, { scale: 1, opacity: 1, rotation: 0, duration: 8 * F, ease: 'back.out(2.6)', immediateRender: false }, n[1] * F);
    tl.to(n[0], { scale: 1.6, opacity: 0, duration: 8 * F, ease: 'power1.in' }, (n[1] + 12) * F);
    WA.shake(tl, '#ny-kb', n[1] * F, 6 * F, 4, { seed: n[1], rot: 3 });
  });
  // the drop
  tl.to('#ny-kb', { rotation: 0, duration: 4 * F }, 56 * F);
  tl.to('#ny-kb', { y: 1360, duration: 12 * F, ease: 'power3.in' }, 60 * F);
  gsap.set('#ny-kb', { transformOrigin: '0px 170px' });
  tl.to('#ny-kb', { scaleY: 0.82, scaleX: 1.12, duration: 3 * F, yoyo: true, repeat: 1, ease: 'power2.out' }, 72 * F);
  WA.shake(tl, '#ny-cam', 72 * F, 16 * F, 22, { decay: true, seed: 9, rot: 0.6 });
  tl.fromTo('#ny-crack', { opacity: 0 }, { opacity: 1, duration: 2 * F, immediateRender: false }, 72 * F);
  WA.word(tl, '#ny-thud', 72 * F, 28, { rot: -6, rot0: 14, seed: 3, amp: 8 });
  var fx = document.getElementById('ny-fx');
  for (var j = 0; j < 7; j++) {
    var d = document.createElement('div'); d.className = 'ny-dust'; d.style.left = (380 + j * 52) + 'px'; d.style.top = '1960px'; fx.appendChild(d);
    tl.fromTo(d, { scale: 0.3, opacity: 1, x: 0, y: 0 }, { scale: 1.4, opacity: 0, x: (j - 3) * 50, y: -60 - (j % 2) * 50, duration: 18 * F, ease: 'power2.out', immediateRender: false }, 72 * F);
  }
  WA.confetti(tl, '#ny-fx', 74 * F, 540, 1900, { seed: 6, n: 46, angle: -1.57, spread: 1.0, speed: 46, g: 1.2, frames: 46 });
  // fireworks
  var fw = [[220, 520, 80, '#FF7A8A'], [820, 440, 88, '#7FB2FF'], [520, 300, 96, '#FFD064'], [300, 820, 104, '#7CF2B0']];
  fw.forEach(function (f, i) {
    var el = document.createElement('div'); el.className = 'ny-fw'; el.style.left = f[0] + 'px'; el.style.top = f[1] + 'px';
    var rays = '';
    for (var k = 0; k < 12; k++) { var a = k * Math.PI / 6; rays += '<path d="M' + (Math.cos(a) * 50).toFixed(0) + ' ' + (Math.sin(a) * 50).toFixed(0) + ' L' + (Math.cos(a) * 140).toFixed(0) + ' ' + (Math.sin(a) * 140).toFixed(0) + '" stroke="' + f[3] + '" stroke-width="14" stroke-linecap="round"/>'; }
    el.innerHTML = '<svg width="320" height="320" viewBox="-160 -160 320 320">' + rays + '<circle r="22" fill="#FFFFFF"/></svg>';
    fx.appendChild(el);
    tl.fromTo(el, { scale: 0.2, opacity: 1 }, { scale: 1.2, opacity: 0, duration: 20 * F, ease: 'power2.out', immediateRender: false }, f[2] * F);
  });

  window.__timelines['joke-nye'] = tl;
})();
</script>
