<script>
(function () {
  var F = WA.F, tl = gsap.timeline({ paused: true });
  var X = 520, Y = 2252, S = 0.8;
  WA.actor('bd-jake', ['table-chew', 'table-buzz', 'table-fling', 'table-beer'], { x: X, y: Y, s: S, member: 'jake', tag: 'JAKE', color: '#E39A2E' });
  WA.pose(tl, '#bd-jake', 'table-chew', 0);
  // broccoli florets on the plate
  var flo = '<svg width="80" height="80" viewBox="-40 -40 80 80"><rect x="-8" y="2" width="16" height="30" rx="6" fill="#8FC85A" stroke="#341720" stroke-width="6"/>' +
    '<g stroke="#341720" stroke-width="6" fill="#4E9A3A"><circle cx="-14" cy="-6" r="16"/><circle cx="14" cy="-6" r="16"/><circle cx="0" cy="-18" r="18"/></g></svg>';
  [['#bd-fl0', 480, 1870], ['#bd-fl1', 540, 1862], ['#bd-fl2', 600, 1872]].forEach(function (f) {
    document.querySelector(f[0]).innerHTML = flo;
    gsap.set(f[0], { x: f[1], y: f[2] });
  });
  gsap.set('#bd-plate', { x: 540, y: 1900 });
  gsap.set('#bd-phone', { x: 850, y: 1890 });
  gsap.set('#bd-note', { x: 975, y: 1800 });
  gsap.set('#bd-mug', { x: 1260, y: 1906 });

  // chew. chew. chew.
  [6, 14, 22, 30].forEach(function (f) { WA.squash(tl, '#bd-jake', f * F, 0.05, 7); });
  // BZZT: THE FELLAS: BEERS?
  tl.set('#bd-scr-on', { opacity: 1 }, 40 * F);
  WA.shake(tl, '#bd-phone svg', 40 * F, 14 * F, 6, { seed: 4, rot: 8, step: 1 });

  WA.popIn(tl, '#bd-note', 42 * F, 9, { rot0: 10, rot: 0 });
  WA.take(tl, '#bd-jake', 'table-buzz', 45 * F, 0.1);
  WA.hop(tl, '#bd-jake', 46 * F, 30, 8);

  // fling the plate
  WA.take(tl, '#bd-jake', 'table-fling', 56 * F, 0.12);
  WA.toss(tl, '#bd-plate', 57 * F, { x0: 540, y0: 1900, vx: -20, vy: -48, g: 1.1, frames: 34, spin: -26, fade: false });
  WA.toss(tl, '#bd-fl0', 57 * F, { x0: 480, y0: 1870, vx: -28, vy: -40, g: 1.2, frames: 30, spin: -30, fade: false });
  WA.toss(tl, '#bd-fl1', 58 * F, { x0: 540, y0: 1862, vx: -8, vy: -54, g: 1.2, frames: 34, spin: 24, fade: false });
  WA.toss(tl, '#bd-fl2', 57 * F, { x0: 600, y0: 1872, vx: 16, vy: -50, g: 1.2, frames: 34, spin: 30, fade: false });
  WA.word(tl, '#bd-yeet', 58 * F, 24, { rot: -10, rot0: 14, seed: 6 });
  WA.squash(tl, '#bd-fl1', 92 * F, 0.35, 10);
  tl.to('#bd-note', { scale: 0, opacity: 0, duration: 5 * F, ease: 'back.in(2)' }, 62 * F);
  tl.set('#bd-scr-on', { opacity: 0 }, 64 * F);

  // a cold one slides in, all the way across to his hand
  tl.to('#bd-mug', { x: 300, duration: 12 * F, ease: 'power3.out' }, 66 * F);
  tl.fromTo('#bd-mug svg', { rotation: -6 }, { rotation: 0, duration: 12 * F, ease: 'power3.out', immediateRender: false }, 66 * F);
  tl.set('#bd-mug', { opacity: 0 }, 80 * F);
  WA.take(tl, '#bd-jake', 'table-beer', 80 * F, 0.12);
  gsap.set('#bd-shine', { x: X + (339 - 640) * S + 40, y: Y + (493 - 1340) * S - 140 });
  WA.popIn(tl, '#bd-shine', 82 * F, 6, { rot0: -40, rot: 0 });
  tl.to('#bd-shine', { scale: 0, rotation: 60, opacity: 0, duration: 8 * F, ease: 'power1.in' }, 90 * F);
  WA.word(tl, '#bd-ahh', 86 * F, 30, { rot: -6, rot0: 10, seed: 2 });
  WA.bob(tl, '#bd-jake', 92 * F, 0.9, 10, 0.45);

  window.__timelines['joke-diet'] = tl;
})();
