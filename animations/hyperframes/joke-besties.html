<script>
(function () {
  var F = WA.F, tl = gsap.timeline({ paused: true });
  // Connor on the left, his friend (no tag: not in the app) on the right; the table hides their legs

  var fr = { skin: '#C98B5E', hair: 'short', hairColor: '#2B1B14', beard: true, coat: 'puffer', top: '#3E8E6F', pants: '#2B2236', legs: 'none', arms: 'down', face: 'smile' };

  WA.buddyIn('ab-f1', Object.assign({}, fr, { face: 'bliss', blush: true }), 840, 2237, 0.75);
  WA.buddyIn('ab-f2', Object.assign({}, fr, { face: 'grin', arms: 'wave', blush: true }), 840, 2237, 0.75, true);
  gsap.set(['#ab-f1', '#ab-f2'], { opacity: 0 });
  // his cup sits in the raised hand (flipped 'wave' arm: hand at -308, -914 of the Buddy canvas)
  gsap.set('#ab-cup', { left: 840 - 308 * 0.75, top: 2237 - 900 * 0.75, rotation: -26, scale: 0.85 });

  // the neon flickers on; the clock ticks over to 3:00
  [[4, 1], [6, 0], [8, 1], [11, 0], [13, 1]].forEach(function (k) {
    if (k[0] === 4) gsap.set('#ab-neon', { opacity: 0 });
    tl.set('#ab-neon', { opacity: k[1] }, k[0] * F);
  });
  tl.set('#ab-neon-off', { opacity: 0 }, 13 * F);
  gsap.set('#ab-mhand', { rotation: -30, svgOrigin: '900 430' });
  [[2, -24], [6, -18], [10, -12], [14, -6], [18, 0]].forEach(function (k) {
    tl.to('#ab-mhand', { rotation: k[1], duration: 2 * F, ease: 'back.out(3)' }, k[0] * F);
  });

  // slide into the booth from both sides
  gsap.set('#ab-connor', { x: -700 });
  gsap.set('#ab-friend', { x: 760 });
  tl.to('#ab-connor', { x: 0, duration: 12 * F, ease: 'power3.out' }, 20 * F);
  tl.to('#ab-friend', { x: 0, duration: 12 * F, ease: 'power3.out' }, 22 * F);
  WA.squash(tl, '#ab-connor', 31 * F, 0.08, 10);
  WA.squash(tl, '#ab-f0', 33 * F, 0.08, 10);

  // the fries mountain lands
  gsap.set('#ab-fries', { y: -2400 });
  tl.to('#ab-fries', { y: 0, duration: 7 * F, ease: 'power2.in' }, 39 * F);
  WA.squash(tl, '#ab-fries', 46 * F, 0.2, 14);
  WA.shake(tl, '#ab-scene', 46 * F, 8 * F, 10, { seed: 2, decay: true });
  WA.word(tl, '#ab-thud', 46 * F, 24, { rot: -8, rot0: 10, seed: 6 });
  WA.hop(tl, '#ab-connor', 46 * F, 40, 8);
  WA.hop(tl, '#ab-friend', 47 * F, 40, 8);
  tl.fromTo('#ab-steam', { y: 10, opacity: 0.3 }, { y: -14, opacity: 0.8, duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: 5, immediateRender: false }, 50 * F);

  // munch
  WA.take(tl, '#ab-connor', 'booth-fry', 54 * F, 0.08);
  tl.set('#ab-f0', { opacity: 0 }, 56 * F);
  tl.set('#ab-f1', { opacity: 1 }, 56 * F);
  WA.squash(tl, '#ab-f1', 56 * F, 0.06, 8);
  [62, 70, 78].forEach(function (f) { WA.squash(tl, '#ab-connor', f * F, 0.05, 6); WA.squash(tl, '#ab-f1', (f + 3) * F, 0.05, 6); });

  // cheers: cups up, lean in, CLINK

  tl.set('#ab-f1', { opacity: 0 }, 84 * F);
  tl.set(['#ab-f2', '#ab-cup'], { opacity: 1 }, 84 * F);
  tl.to('#ab-connor', { x: 22, duration: 4 * F, ease: 'power2.in' }, 86 * F);
  tl.to('#ab-friend', { x: -22, duration: 4 * F, ease: 'power2.in' }, 86 * F);
  tl.to('#ab-connor', { x: 0, duration: 8 * F, ease: 'back.out(2)' }, 90 * F);
  tl.to('#ab-friend', { x: 0, duration: 8 * F, ease: 'back.out(2)' }, 90 * F);
  gsap.set('#ab-spark', { left: 548, top: 1400 });

  tl.to('#ab-spark', { scale: 0, rotation: 60, opacity: 0, duration: 8 * F, ease: 'power1.in' }, 97 * F);
  WA.word(tl, '#ab-clink', 90 * F, 28, { rot: -6, rot0: 12, seed: 3 });
  WA.popIn(tl, '#ab-heart', 102 * F, 10, { rot0: -20, rot: 0 });
  WA.bob(tl, '#ab-heart', 112 * F, 1.2, 12, 0.6);

  window.__timelines['joke-besties'] = tl;
})();
