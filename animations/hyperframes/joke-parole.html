<script>
(function () {
  var F = WA.F, tl = gsap.timeline({ paused: true }), s = 0.5;
  WA.actor('pa-guy', ['bars', 'free-a', 'free-b'], { x: 540, y: 1650, s: s });
  // the ankle monitor rides on his right ankle in each pose (anchors from cast/flex.json)
  var ank = { bars: [698, 1315], 'free-a': [692, 1308] };   // in free-b that foot is lifted behind him, so no monitor
  var jit = document.querySelector('#pa-guy .jit');
  Object.keys(ank).forEach(function (p) {
    var d = document.createElement('div'); d.className = 'pose mon'; d.dataset.pose = p;
    d.innerHTML = '<svg width="112" height="84" viewBox="-40 -30 80 60" style="left:' + (ank[p][0] * s - 56) + 'px;top:' + (ank[p][1] * s - 60) + 'px">' +
      '<rect x="-34" y="-12" width="68" height="30" rx="10" fill="#2B2236" stroke="#341720" stroke-width="5"/>' +
      '<rect x="-16" y="-24" width="32" height="20" rx="6" fill="#3A3350" stroke="#341720" stroke-width="5"/>' +
      '<circle class="pa-led" cx="0" cy="-14" r="7" fill="#FF3B4A"/></svg>';
    jit.appendChild(d);
  });
  WA.pose(tl, '#pa-guy', 'bars', 0);
  gsap.set('#pa-guy', { filter: 'brightness(0.55)', transformOrigin: (640 * s) + 'px ' + (1340 * s) + 'px' });
  for (var k = 0; k < 28; k++) tl.set('.pa-led', { opacity: k % 2 ? 0.15 : 1 }, k * 6 * F);
  tl.fromTo('#pa-rays', { rotation: 0 }, { rotation: 40, duration: 5.5, ease: 'none' }, 0);

  // behind bars, sad; the buzzer; the bars slide away
  WA.shake(tl, '#pa-bars', 26 * F, 4 * F, 3, { seed: 3 });
  WA.word(tl, '#pa-bzzt', 26 * F, 20, { rot: -6, rot0: 10, seed: 4, amp: 6 });
  tl.to('#pa-bars', { x: 520, duration: 14 * F, ease: 'power2.inOut' }, 30 * F);
  // he walks out into the sun, toward us
  WA.cycle(tl, '#pa-guy', ['free-a', 'free-b'], 46 * F, 5.5, 7, 12);
  tl.to('#pa-guy', { y: 380, scale: 1.55, duration: 72 * F, ease: 'power1.out' }, 46 * F);
  tl.to('#pa-guy', { filter: 'brightness(1)', duration: 16 * F, ease: 'power1.out' }, 44 * F);
  tl.fromTo('#pa-glow', { opacity: 0 }, { opacity: 0.6, duration: 20 * F, ease: 'power1.out', immediateRender: false }, 46 * F);
  WA.word(tl, '#pa-free', 56 * F, 26, { rot: -8, rot0: 12, seed: 6, amp: 6 });
  // BEEP. BEEP.
  [[70, 760, 1860], [96, 840, 1990]].forEach(function (b, i) {
    gsap.set('#pa-beep' + i, { left: b[1], top: b[2] });
    tl.fromTo('#pa-beep' + i, { opacity: 1, scale: 0.4, y: 0 }, { opacity: 0, scale: 1.2, y: -60, duration: 16 * F, ease: 'power1.out', immediateRender: false }, b[0] * F);
  });
  // birds
  tl.fromTo('#pa-b0', { x: 0, y: 0 }, { x: 1300, y: -120, duration: 3.4, ease: 'none' }, 1.6);
  tl.fromTo('#pa-b1', { x: 0, y: 0 }, { x: 1300, y: -60, duration: 3.8, ease: 'none' }, 1.8);
  [0, 1].forEach(function (i) { tl.fromTo('#pa-b' + i + ' svg', { scaleY: 1 }, { scaleY: -0.6, duration: 4 * F, yoyo: true, repeat: 25, ease: 'sine.inOut' }, 0); });

  window.__timelines['joke-parole'] = tl;
})();
</script>
