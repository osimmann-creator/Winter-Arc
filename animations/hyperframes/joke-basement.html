<!doctype html>
<!--
  Operation Basement (joke-basement): a townhouse at night. The upstairs light goes out, the tiny basement
  window creaks open and Dean squeezes out... and gets stuck halfway. Then he POPS out and tiptoes off into the dark.
  Beats (30 fps): lights out 6, window creaks 12-24, Dean rises 24-36, stuck 36-66 (HNNG 42), POP 68, lands 82,
  tiptoe 84-118, the cat looks away 104, card 120.
-->

 <div id="card" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="4.0" data-duration="1.5" data-track-index="2" data-width="1080" data-height="2348"
      data-variable-values='{"title":"OPERATION|BASEMENT","pts":"0","unit":"WITNESSES","sub":"DEAN SNUCK OUT FOR POINTS","color":"#EE5982","dark":"#A83560","light":"#FFD6E2"}'></div>

<script>
(function () {
  var F = WA.F, tl = gsap.timeline({ paused: true }), r = WA.rng(11);
  WA.spawn('#ob-stars', 26, function () { return '<i class="ob-star"></i>'; }).forEach(function (st, i) {
    gsap.set(st, { x: r() * 1080, y: 60 + r() * 520, scale: 0.5 + r() });
    tl.fromTo(st, { opacity: 0.35 }, { opacity: 1, duration: (8 + (i % 5) * 3) * F, yoyo: true, repeat: 9, ease: 'sine.inOut' }, (i % 7) * F);
  });
  // Dean, stuck in the window (only what's above the sill shows), and Dean free
  WA.actor('ob-stuck', ['stuck'], { x: 620, y: 1945, s: 0.52, member: 'dean', tag: 'DEAN', color: '#EE5982', tagY: 40 });
  WA.actor('ob-free', ['stuck', 'tiptoe-a', 'tiptoe-b'], { x: 620, y: 1880, s: 0.5, member: 'dean', tag: 'DEAN', color: '#EE5982', tagY: 40 });
  WA.pose(tl, '#ob-stuck', 'stuck', 0);
  gsap.set('#ob-free', { opacity: 0 });
  gsap.set('#ob-stuck', { y: 330 });
  gsap.set('#ob-stuck .tag', { opacity: 0 });
  tl.to('#ob-stuck .tag', { opacity: 1, duration: 6 * F }, 30 * F);
  tl.set('#ob-free .tag', { opacity: 0 }, 68 * F);
  tl.to('#ob-free .tag', { opacity: 1, duration: 4 * F }, 82 * F);
  tl.fromTo('#ob-cam', { scale: 1.12 }, { scale: 1.0, duration: 5.5, ease: 'sine.inOut' }, 0);

  // lights out upstairs, then the window creaks open
  tl.set(['#ob-lit', '#ob-sil'], { opacity: 0 }, 6 * F);
  tl.fromTo('#ob-pane', { scaleY: 1, skewX: 0 }, { scaleY: -0.55, skewX: -8, duration: 14 * F, ease: 'power2.inOut', immediateRender: false }, 12 * F);
  WA.word(tl, '#ob-creak', 12 * F, 26, { rot: -4, rot0: 6, seed: 3, amp: 3 });
  // he rises out... and sticks
  tl.to('#ob-stuck', { y: 0, duration: 12 * F, ease: 'back.out(1.6)' }, 24 * F);
  WA.shake(tl, '#ob-stuck .jit', 36 * F, 30 * F, 4, { grow: 1.5, seed: 4, rot: 2 });
  WA.shake(tl, '#ob-pane', 40 * F, 24 * F, 2, { seed: 6 });
  WA.word(tl, '#ob-hnng', 42 * F, 24, { rot: 8, rot0: -10, seed: 5, amp: 6 });
  tl.to('#ob-stuck', { y: 40, duration: 4 * F, ease: 'power2.in' }, 62 * F);

  // POP!
  tl.set('#ob-stuck', { opacity: 0 }, 68 * F);
  tl.set('#ob-free', { opacity: 1, x: 0, y: -60 }, 68 * F);
  WA.pose(tl, '#ob-free', 'stuck', 68 * F);
  tl.to('#ob-free', { y: -380, rotation: 200, duration: 7 * F, ease: 'power2.out' }, 68 * F);
  tl.to('#ob-free', { y: 0, x: 70, rotation: 360, duration: 7 * F, ease: 'power2.in' }, 75 * F);
  tl.set('#ob-free', { rotation: 0 }, 82 * F);
  WA.word(tl, '#ob-pop', 68 * F, 24, { rot: -8, rot0: 16, seed: 7, amp: 7 });
  WA.spawn('#ob-puffs', 7, function () { return ''; }).forEach(function (p, i) {
    p.className = 'ob-puff'; p.style.left = (560 + i * 20) + 'px'; p.style.top = '1690px';
    var a = -Math.PI * (0.1 + 0.8 * i / 6);
    tl.fromTo(p, { scale: 0.3, opacity: 1, x: 0, y: 0 }, { scale: 1.3, opacity: 0, x: Math.cos(a) * 140, y: Math.sin(a) * 110, duration: 18 * F, ease: 'power2.out', immediateRender: false }, 68 * F);
  });
  WA.squash(tl, '#ob-free', 82 * F, 0.12, 10);
  // tiptoe off into the dark
  WA.cycle(tl, '#ob-free', ['tiptoe-a', 'tiptoe-b'], 84 * F, 5.5, 6, 14);
  tl.to('#ob-free', { x: 560, duration: 36 * F, ease: 'none' }, 84 * F);
  // the only witness looks away
  tl.to('#ob-eyes', { scaleY: 0.1, transformOrigin: '50% 50%', duration: 3 * F, yoyo: true, repeat: 1 }, 60 * F);
  tl.to('#ob-eyes', { scaleY: 0.05, transformOrigin: '50% 50%', duration: 4 * F }, 104 * F);

  window.__timelines['joke-basement'] = tl;
})();
</script>
