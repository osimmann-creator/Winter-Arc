<!doctype html>
<!--
  Early Spring (joke-spring): a grey morning over the groundhog hole. Phil pops out and looks down for his shadow:
  nothing there, just a dotted outline and a ?. NO SHADOW! On go the shades, the clouds roll off and the sun comes
  out, and a beach chair and umbrella pop open right there in the snow. Phil is in it, arms behind his head.
  (No flowers: Cleared to Play already ends that way.)
  Beats (30 fps): pop out 12, look down 24, ? 30, NO SHADOW 40, shades 54, sun 60, chair 76, lounging 88, card 120.
-->

  #es-snow { position: absolute; inset: 0; }

  #es-q svg { position: absolute; left: -40px; top: -60px; overflow: visible; }
  #es-chair { position: absolute; left: 0; top: 0; width: 1080px; height: 2348px; opacity: 0; }
  #es-rays { transform-origin: 840px 1000px; }
  #es-glint { position: absolute; width: 0; height: 0; opacity: 0; }
  #es-glint svg { position: absolute; left: -40px; top: -40px; overflow: visible; }
</style>
</head>
<body>
<div id="root" data-composition-id="joke-spring" data-start="0" data-duration="5.5" data-width="1080" data-height="2348">
 <div id="es-scene" class="clip" data-start="0" data-duration="5.5" data-track-index="0" style="position:absolute;inset:0;overflow:hidden;background:#DCE3EA">

      <linearGradient id="es-blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6CC0F5"/><stop offset="1" stop-color="#E4F6FF"/></linearGradient>

    </g>
    <circle cx="840" cy="1000" r="110" fill="#FFE08A" stroke="#341720" stroke-width="9"/>
    <g id="es-cloud0" fill="#C3CBD6" stroke="#341720" stroke-width="8"><path d="M600 1060 Q610 960 700 970 Q740 890 830 920 Q900 870 960 940 Q1060 940 1050 1040 Q1060 1100 990 1100 L640 1100 Q580 1100 600 1060 Z"/></g>
    <g id="es-cloud1" fill="#B3BCC9" stroke="#341720" stroke-width="8"><path d="M700 1160 Q700 1090 780 1100 Q820 1040 900 1070 Q980 1050 1000 1120 Q1060 1130 1050 1180 L720 1190 Q680 1190 700 1160 Z"/></g>
    <!-- trees -->

      <path d="M120 1500 L120 900 M120 1100 L40 980 M120 1040 L210 920 M120 1220 L200 1150 M210 920 L240 860 M40 980 L20 930"/>

  </div>

 </div>

 <div id="card" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="4.0" data-duration="1.5" data-track-index="2" data-width="1080" data-height="2348"
      data-variable-values='{"title":"EARLY SPRING","pts":"3","unit":"DAYS","sub":"NO SHADOW","color":"#45B87A","dark":"#2E7E52","light":"#DDF6E6"}'></div>
</div>
<script>
(function () {
  var F = WA.F, tl = gsap.timeline({ paused: true });
  var Z = 1.14;
  tl.fromTo('#es-cam', { scale: Z }, { scale: Z + 0.06, duration: 5.5, ease: 'sine.inOut' }, 0);
  // Phil in the hole (the clip box hides him below the hole line, y 1822)
  WA.actor('es-phil', ['grin', 'look-down', 'shades'], { x: 300, y: 2035 - 700, s: 0.62, member: 'phil', tag: 'PHIL', color: '#D9644F' });
  WA.pose(tl, '#es-phil', 'grin', 0);
  gsap.set('#es-phil', { y: 900 });
  // ... and lounging in the chair later
  WA.actor('es-lounge', ['beach'], { x: 790, y: 1900 + (1340 - 996) * 0.5, s: 0.5, member: 'phil', tag: 'PHIL', color: '#D9644F' });
  gsap.set('#es-lounge', { rotation: -6, transformOrigin: (640 * 0.5) + 'px ' + (996 * 0.5) + 'px' });
  WA.pose(tl, '#es-lounge', 'beach', 0);
  WA.snow(tl, '#es-snow', { n: 26, seed: 8, speed: 120, drift: -20, size: [8, 13] });

  // up he comes; he looks down for his shadow
  tl.to('#es-phil', { y: 0, duration: 7 * F, ease: 'back.out(1.7)' }, 12 * F);
  WA.take(tl, '#es-phil', 'look-down', 24 * F, 0.08);
  tl.fromTo('#es-shadow', { opacity: 0 }, { opacity: 1, duration: 4 * F, immediateRender: false }, 26 * F);
  WA.popIn(tl, '#es-q', 30 * F, 9, { rot0: -30, rot: 8 });
  WA.bob(tl, '#es-q', 40 * F, 0.5, 10, 0.4);
  WA.word(tl, '#es-noshadow', 40 * F, 30, { rot: -6, rot0: 12, seed: 4, amp: 6 });
  tl.to('#es-q', { scale: 0, opacity: 0, duration: 5 * F }, 56 * F);
  tl.to('#es-shadow', { opacity: 0, duration: 5 * F }, 56 * F);

  // shades on; the clouds roll off; spring
  WA.take(tl, '#es-phil', 'shades', 54 * F, 0.1);
  tl.to('#es-cloud0', { x: 700, duration: 14 * F, ease: 'power2.in' }, 58 * F);
  tl.to('#es-cloud1', { x: 600, duration: 16 * F, ease: 'power2.in' }, 60 * F);
  tl.to(['#es-sky-b', '#es-rays'], { opacity: 1, duration: 16 * F, ease: 'sine.inOut' }, 62 * F);
  tl.to('#es-snow', { opacity: 0, duration: 10 * F }, 60 * F);
  tl.fromTo('#es-rays', { rotation: 0 }, { rotation: 45, duration: 60 * F, ease: 'none', immediateRender: false }, 62 * F);
  // the chair pops open; he's in it
  tl.fromTo('#es-chair', { opacity: 1, scale: 0, rotation: -10 }, { opacity: 1, scale: 1, rotation: 0, duration: 9 * F, ease: 'back.out(2)', immediateRender: false }, 76 * F);
  gsap.set('#es-chair', { transformOrigin: '770px 2060px' });
  gsap.set('#es-lounge', { opacity: 0 });
  tl.to('#es-phil', { y: 900, duration: 5 * F, ease: 'power2.in' }, 84 * F);
  tl.set('#es-lounge', { opacity: 1 }, 88 * F);
  WA.squash(tl, '#es-lounge', 88 * F, 0.12, 12);
  gsap.set('#es-glint', { left: 770, top: 1660 });
  WA.popIn(tl, '#es-glint', 98 * F, 6, { rot0: -40, rot: 0 });
  tl.to('#es-glint', { scale: 0, rotation: 60, opacity: 0, duration: 8 * F, ease: 'power1.in' }, 106 * F);

  window.__timelines['joke-spring'] = tl;
})();
</script>
