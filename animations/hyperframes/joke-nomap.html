 <div id="card" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="4.0" data-duration="1.5" data-track-index="2" data-width="1080" data-height="2348"
      data-variable-values='{"title":"NO MAP","pts":"3","unit":"LAPS","sub":"NO SIGNAL. NO IDEA.","color":"#1FA3A0","dark":"#136E6C","light":"#C9F2F0"}'></div>
</div>
<script>
(function () {
  var F = WA.F, tl = gsap.timeline({ paused: true });
  // both walk the same way; Connor a step behind Dylan
  WA.actor('nm-dylan', ['walk-a', 'walk-b', 'point-l'], { x: 0, y: 1760, s: 0.58, member: 'dylan', tag: 'DYLAN', color: '#1FA3A0' });
  WA.actor('nm-connor', ['walk-a', 'walk-b', 'point-r'], { x: 0, y: 1712, s: 0.55, member: 'connor', tag: 'CONNOR', color: '#2F66E6' });
  WA.snow(tl, '#nm-snow', { n: 40, seed: 6, speed: 220, drift: -40, size: [8, 14] });
  gsap.set(['#nm-dylan', '#nm-connor'], { x: -300 });

  var laps = [[0, 30], [32, 62]];
  laps.forEach(function (l, i) {
    tl.fromTo('#nm-dylan', { x: -260 }, { x: 1380, duration: (l[1] - l[0]) * F, ease: 'none', immediateRender: i === 0 }, l[0] * F);
    tl.fromTo('#nm-connor', { x: -420 }, { x: 1220, duration: (l[1] - l[0]) * F, ease: 'none', immediateRender: i === 0 }, l[0] * F);
    tl.fromTo('#nm-pupils', { x: -7 }, { x: 7, duration: (l[1] - l[0]) * F, ease: 'none', immediateRender: i === 0 }, l[0] * F);
  });
  // lap 3: in again, and stop either side of the snowman
  tl.fromTo('#nm-dylan', { x: -260 }, { x: 300, duration: 22 * F, ease: 'power1.out', immediateRender: false }, 64 * F);
  tl.fromTo('#nm-connor', { x: -420 }, { x: 800, duration: 26 * F, ease: 'power1.out', immediateRender: false }, 64 * F);
  tl.fromTo('#nm-pupils', { x: -7 }, { x: 0, duration: 24 * F, ease: 'none', immediateRender: false }, 64 * F);
  WA.cycle(tl, '#nm-dylan', ['walk-a', 'walk-b'], 0, 88 * F, 5, 8);
  WA.cycle(tl, '#nm-connor', ['walk-b', 'walk-a'], 0, 90 * F, 5, 8);
  // LAP 1 / 2 / 3
  tl.fromTo('#nm-lap', { scale: 0, rotation: -12, opacity: 1 }, { scale: 1, rotation: -3, opacity: 1, duration: 9 * F, ease: 'back.out(2.4)', immediateRender: false }, 8 * F);
  [8, 40, 72].forEach(function (f, i) {
    tl.set('#nm-l' + (i + 1), { opacity: 1 }, f * F);
    if (i) { tl.set('#nm-l' + i, { opacity: 0 }, f * F); WA.squash(tl, '#nm-lap', f * F, 0.18, 10); }
  });
  tl.to('#nm-lap', { scale: 0, opacity: 0, duration: 6 * F, ease: 'back.in(2)' }, 110 * F);
  tl.to('#nm-brows', { opacity: 1, duration: 4 * F }, 72 * F);
  // stop, point opposite ways, ? ?
  WA.take(tl, '#nm-dylan', 'point-l', 92 * F, 0.08);
  WA.take(tl, '#nm-connor', 'point-r', 92 * F, 0.08);
  WA.popIn(tl, '#nm-q0', 96 * F, 9, { rot0: -30, rot: -10 });
  WA.popIn(tl, '#nm-q1', 99 * F, 9, { rot0: 30, rot: 10 });
  WA.bob(tl, '#nm-q0', 106 * F, 1.2, 12, 0.6);
  WA.bob(tl, '#nm-q1', 108 * F, 1.2, 12, 0.6);

  window.__timelines['joke-nomap'] = tl;
})();
</script>
