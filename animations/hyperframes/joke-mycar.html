<script>
(function () {
  var F = WA.F, tl = gsap.timeline({ paused: true });
  // the passengers, in car space (the car is drawn 900x460 and shown at 0.85)
  WA.actor('mc-osim', ['nervous', 'dazed'], { x: 372, y: 463, s: 0.4 });
  WA.buddyIn('mc-drv', { face: 'smug', shades: true, hair: 'buzz', skin: '#8D5A3B', top: '#1B1726', arms: 'wheel' }, 560, 470, 0.4);
  WA.buddyIn('mc-drv2', { face: 'dazed', hair: 'buzz', skin: '#8D5A3B', top: '#1B1726', arms: 'wheel' }, 560, 470, 0.4);
  gsap.set('#mc-drv2', { opacity: 0 });
  WA.snow(tl, '#mc-snow', { n: 45, seed: 4, speed: 260, drift: -50, size: [8, 16] });

  // roll in, then roll on (wheels turn with the distance)
  tl.fromTo('#mc-car', { x: -920 }, { x: 40, duration: 40 * F, ease: 'power2.out' }, 0);
  tl.to('#mc-car', { x: 112, duration: 38 * F, ease: 'power1.in' }, 40 * F);
  tl.fromTo(['#mc-w0', '#mc-w1'], { rotation: 0 }, { rotation: 900, duration: 40 * F, ease: 'power2.out' }, 0);
  tl.to(['#mc-w0', '#mc-w1'], { rotation: 1010, duration: 38 * F, ease: 'power1.in' }, 40 * F);
  tl.fromTo('#mc-carin', { y: 0 }, { y: -5, duration: 4 * F, yoyo: true, repeat: 17, ease: 'sine.inOut' }, 0);
  WA.pose(tl, '#mc-osim', 'nervous', 0);
  WA.bob(tl, '#mc-tag', 0.3, 2.2, 6, 0.9);
  tl.fromTo('#mc-cam', { scale: 1 }, { scale: 1.08, duration: 5.5, ease: 'sine.inOut' }, 0);
  WA.shake(tl, '#mc-osim .jit', 30 * F, 44 * F, 2, { grow: 1, seed: 3 });
  // MY CAR. MY RULES.
  WA.popIn(tl, '#mc-bubble', 18 * F, 10, { rot0: -10, rot: -3 });
  tl.to('#mc-bubble', { x: 72, duration: 38 * F, ease: 'power1.in' }, 40 * F);
  WA.popOut(tl, '#mc-bubble', 74 * F, 6);

  // BONK
  tl.to('#mc-car', { rotation: -5, scaleX: 0.95, duration: 3 * F, ease: 'power2.out' }, 78 * F);
  tl.to('#mc-car', { rotation: 0, scaleX: 1, duration: 14 * F, ease: 'elastic.out(1, 0.4)' }, 81 * F);
  WA.shake(tl, '#mc-cam', 78 * F, 12 * F, 14, { decay: true, seed: 7, rot: 0.4 });
  WA.word(tl, "#mc-bonk", 78 * F, 28, { rot: 8, rot0: -16, seed: 3, amp: 7 });
  var puff = WA.spawn('#mc-puff', 9, function () { return ''; });
  puff.forEach(function (p, i) {
    var a = -Math.PI * (0.15 + 0.7 * (i / 8)), d = 130 + (i % 3) * 50;
    p.className = 'mc-p'; p.style.left = '880px'; p.style.top = '1520px';
    tl.fromTo(p, { scale: 0.3, opacity: 1, x: 0, y: 0 },
      { x: Math.cos(a) * d - 60, y: Math.sin(a) * d, scale: 1.2 + (i % 2) * 0.4, opacity: 0, duration: 20 * F, ease: 'power2.out', immediateRender: false }, (78 + (i % 3)) * F);
  });
  // the airbags pop, then sag a little
  ['#mc-bag0', '#mc-bag1'].forEach(function (id, i) {
    tl.fromTo(id, { scale: 0, opacity: 1 }, { scale: 1.15, opacity: 1, duration: 5 * F, ease: 'back.out(3)', immediateRender: false }, (80 + i) * F);
    tl.to(id, { scale: 0.78, x: i ? 16 : -16, y: 34, duration: 14 * F, ease: 'power2.inOut' }, 96 * F);
  });
  WA.pose(tl, '#mc-osim', 'dazed', 86 * F);
  tl.set('#mc-drv2', { opacity: 1 }, 86 * F);
  tl.set('#mc-drv', { opacity: 0 }, 86 * F);
  // dizzy stars round Osim's head
  ['#mc-s0', '#mc-s1', '#mc-s2'].forEach(function (id, i) {
    tl.set(id, { opacity: 1, x: Math.cos(i * 2.1) * 90, y: Math.sin(i * 2.1) * 24 }, 94 * F);
    for (var k = 0; k < 6; k++) {
      var a0 = i * 2.1 + k * 1.05, a1 = a0 + 1.05;
      tl.to(id, { x: Math.cos(a1) * 90, y: Math.sin(a1) * 24, duration: 4 * F, ease: 'none' }, (94 + k * 4) * F);
    }
  });
  // a clump of snow drops onto the roof
  WA.toss(tl, '#mc-chunk', 88 * F, { x0: 930, y0: 1320, vx: -36, vy: -20, g: 2.2, frames: 12, fade: false });
  tl.to('#mc-chunk', { rotation: -8, duration: 3 * F }, 100 * F);

  window.__timelines['joke-mycar'] = tl;
})();
</script>
