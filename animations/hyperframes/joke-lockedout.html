  // the phone buzzes: glow, shake, DOOR CODE (and he looks at the window the whole time)
  [[32, '#lo-bz0', false], [58, '#lo-bz1', false], [84, '#lo-bz2', true]].forEach(function (b) {

  tl.fromTo('#lo-glow', { scale: 1.2 }, { scale: 0.9, duration: 8 * F, ease: 'sine.inOut', yoyo: true, repeat: 5, immediateRender: false }, 92 * F);
