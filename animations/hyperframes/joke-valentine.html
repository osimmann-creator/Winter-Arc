<script>
(function () {
  var F = WA.F, tl = gsap.timeline({ paused: true });
  WA.actor('va-sit', ['couch', 'startle'], { x: 300, y: 1850, s: 0.62 });
  WA.actor('va-run', ['love-a', 'love-b'], { x: 300, y: 1880, s: 0.62, flip: true });
  WA.pose(tl, '#va-sit', 'couch', 0);
  gsap.set('#va-run', { opacity: 0 });
  // scrolling...
  WA.shake(tl, '#va-sit .jit', 4 * F, 20 * F, 1.2, { seed: 2, step: 4 });
  // the arrow
  tl.fromTo('#va-arrow', { x: 1200, y: 1290, rotation: -10, opacity: 1 }, { x: 545, y: 1420, rotation: -16, opacity: 1, duration: 8 * F, ease: 'none', immediateRender: false }, 22 * F);
  tl.fromTo('#va-arrow', { rotation: -24 }, { rotation: -16, duration: 18 * F, ease: 'elastic.out(1.4, 0.2)', immediateRender: false }, 30 * F);
  WA.word(tl, '#va-thunk', 30 * F, 24, { rot: 8, rot0: -14, seed: 3, amp: 6 });
  WA.take(tl, '#va-sit', 'startle', 34 * F, 0.1);
  WA.hop(tl, '#va-sit', 34 * F, 30, 8);
  // hearts pop all around him
  var spots = [[200, 1180], [420, 1100], [600, 1240], [140, 1380], [520, 1420], [330, 960], [700, 1060]];
  var hearts = WA.spawn('#va-hearts', spots.length, function () {

  });
  hearts.forEach(function (h, i) {
    var el = h.firstChild;
    gsap.set(el, { left: spots[i][0], top: spots[i][1] });
    tl.fromTo(el, { scale: 0, opacity: 1, y: 0, rotation: -20 }, { scale: 1 + (i % 3) * 0.25, opacity: 1, y: -30, rotation: (i % 2 ? 12 : -12), duration: 9 * F, ease: 'back.out(2.6)', immediateRender: false }, (36 + i * 3) * F);
    tl.to(el, { y: -160, opacity: 0, duration: 16 * F, ease: 'power1.in' }, (58 + i * 2) * F);
  });
  // he jumps up and runs out the door
  tl.set('#va-sit', { opacity: 0 }, 62 * F);
  tl.set('#va-run', { opacity: 1 }, 62 * F);
  tl.fromTo('#va-run', { y: -60 }, { y: -160, duration: 4 * F, ease: 'power2.out', immediateRender: false }, 62 * F);
  tl.to('#va-run', { y: 0, duration: 4 * F, ease: 'power2.in' }, 66 * F);
  WA.cycle(tl, '#va-run', ['love-a', 'love-b'], 62 * F, 92 * F, 4, 10);
  tl.to('#va-run', { x: 640, duration: 20 * F, ease: 'power1.in' }, 66 * F);
  tl.to('#va-door', { scaleX: 0.12, duration: 6 * F, ease: 'power2.out' }, 74 * F);
  tl.to('#va-run', { scale: 0.85, opacity: 0, duration: 4 * F }, 84 * F);
  tl.to('#va-door', { scaleX: 1, duration: 4 * F, ease: 'power3.in' }, 88 * F);
  WA.shake(tl, '#va-cam', 92 * F, 10 * F, 10, { decay: true, seed: 6 });
  WA.word(tl, '#va-slam', 92 * F, 24, { rot: -6, rot0: 12, seed: 7, amp: 6 });
  tl.fromTo('#va-cam', { scale: 1 }, { scale: 1.06, duration: 5.5, ease: 'sine.inOut' }, 0);

  window.__timelines['joke-valentine'] = tl;
})();
</script>
