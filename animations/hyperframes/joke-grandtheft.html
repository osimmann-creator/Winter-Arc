<script>
(function () {
  var F = WA.F, tl = gsap.timeline({ paused: true });
  var door = '<circle cx="455" cy="300" r="54" fill="#FFFFFF" stroke="#341720" stroke-width="8"/><text x="455" y="324" text-anchor="middle" font-family="Luckiest Guy" font-size="62" fill="#341720">#1</text>';

  var cab = document.getElementById('gt-car-cabin');
  cab.innerHTML = '<div id="gt-d0"></div><div id="gt-in"></div>';
  WA.buddyIn('gt-d0', { face: 'smile', hat: 'cap', hatColor: '#E05A47', top: '#2FA36B', arms: 'wheel' }, 560, 470, 0.4);
  WA.actor('gt-in', ['drive'], { x: 560, y: 465, s: 0.4 });
  WA.pose(tl, '#gt-in', 'drive', 0);
  gsap.set('#gt-in', { y: 200 });
  WA.actor('gt-thief', ['run-a', 'run-b'], { x: -260, y: 1880, s: 0.6 });
  // the driver once he's out: flying, then sat on the sidewalk, then raging
  document.getElementById('gt-driver').innerHTML = '<div id="gt-fly"></div><div id="gt-sat"></div><div id="gt-mad"></div>';
  WA.buddyIn('gt-fly', { face: 'scared', hat: 'cap', hatColor: '#E05A47', top: '#2FA36B', arms: 'flail' }, 0, 0, 0.5);
  WA.buddyIn('gt-sat', { face: 'dazed', hat: 'cap', hatColor: '#E05A47', top: '#2FA36B', arms: 'down', legs: 'ground' }, 330, 2010, 0.55);
  WA.buddyIn('gt-mad', { face: 'mad', hat: 'cap', hatColor: '#E05A47', top: '#2FA36B', arms: 'up', legs: 'ground' }, 330, 2010, 0.55);
  gsap.set(['#gt-fly', '#gt-sat', '#gt-mad'], { opacity: 0 });

  // the thief runs in
  WA.cycle(tl, '#gt-thief', ['run-a', 'run-b'], 0, 30 * F, 4, 10);
  tl.fromTo('#gt-thief', { x: 0 }, { x: 640, duration: 26 * F, ease: 'power1.in' }, 4 * F);
  // YOINK: the driver flies out, the thief dives in
  tl.set('#gt-d0', { opacity: 0 }, 30 * F);
  WA.word(tl, '#gt-yank', 30 * F, 24, { rot: -8, rot0: 14, seed: 2, amp: 6 });
  tl.set('#gt-fly', { opacity: 1 }, 30 * F);
  tl.fromTo('#gt-fly', { x: 520, y: 1560, rotation: 0 }, { x: 200, y: 1250, rotation: -200, duration: 8 * F, ease: 'power2.out', immediateRender: false }, 30 * F);
  tl.to('#gt-fly', { x: 30, y: 1500, rotation: -380, duration: 8 * F, ease: 'power2.in' }, 38 * F);
  tl.set('#gt-fly', { opacity: 0 }, 46 * F);
  tl.set('#gt-sat', { opacity: 1 }, 46 * F);
  WA.squash(tl, '#gt-sat', 46 * F, 0.14, 12);
  WA.shake(tl, '#gt-cam', 46 * F, 8 * F, 8, { decay: true, seed: 3 });
  tl.to('#gt-thief', { x: 760, y: -160, scale: 0.6, duration: 5 * F, ease: 'power2.in' }, 31 * F);
  tl.set('#gt-thief', { opacity: 0 }, 36 * F);
  tl.to('#gt-in', { y: 0, duration: 6 * F, ease: 'back.out(2)' }, 36 * F);

  // VROOOM
  tl.to('#gt-car', { x: 1300, duration: 18 * F, ease: 'power2.in' }, 48 * F);
  tl.to('#gt-car', { rotation: -2, duration: 4 * F, ease: 'power1.out', yoyo: true, repeat: 1 }, 48 * F);
  tl.to(['#gt-car-w0', '#gt-car-w1'], { rotation: 1440, duration: 20 * F, ease: 'power2.in' }, 46 * F);
  WA.word(tl, '#gt-vroom', 48 * F, 26, { rot: -4, rot0: 10, seed: 6, amp: 6 });
  var fx = document.getElementById('gt-fx');
  for (var i = 0; i < 5; i++) {
    var l = document.createElement('div'); l.className = 'gt-line'; l.style.top = (1420 + i * 60) + 'px'; l.style.left = '0px'; l.style.width = (220 + (i % 3) * 80) + 'px'; fx.appendChild(l);
    tl.fromTo(l, { x: 100 + i * 30, opacity: 1, scaleX: 0.3 }, { x: 700 + i * 50, opacity: 0, scaleX: 1.4, duration: 16 * F, ease: 'power1.in', immediateRender: false }, (50 + i * 3) * F);
  }
  for (var j = 0; j < 6; j++) {
    var d = document.createElement('div'); d.className = 'gt-dust'; d.style.left = (170 + j * 30) + 'px'; d.style.top = '1740px'; fx.appendChild(d);
    tl.fromTo(d, { scale: 0.3, opacity: 1, x: 0, y: 0 }, { scale: 1.3 + (j % 2) * 0.4, opacity: 0, x: -60 - j * 20, y: -40 - (j % 3) * 30, duration: 20 * F, ease: 'power2.out', immediateRender: false }, (48 + j * 2) * F);
  }

  tl.set('#gt-mad', { opacity: 1 }, 84 * F);

  WA.word(tl, '#gt-hey', 84 * F, 30, { rot: 6, rot0: -14, seed: 9, amp: 7 });

  window.__timelines['joke-grandtheft'] = tl;
})();
