</head>

 <div id="card" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="4.0" data-duration="1.5" data-track-index="2" data-width="1080" data-height="2348"

</div>
<script>
(function () {
  var F = WA.F, tl = gsap.timeline({ paused: true });
  // twinkling lights on the string
  var cols = ['#FF5A5A', '#FFD064', '#7CF2B0', '#7FB2FF', '#FF9FD0'], lights = document.getElementById('xm-lights');
  for (var i = 0; i < 11; i++) {
    var x = -20 + i * 110, t = x / 1080, y = (1 - t) * (1 - t) * 300 + 2 * (1 - t) * t * (t < 0.5 ? 420 : 420) + t * t * 300;
    y = 300 + Math.sin(Math.PI * ((x + 20) / 560)) * (x < 540 ? 70 : 70) * (x < 540 ? 1 : 1);
    var l = document.createElement('div'); l.className = 'xm-light'; l.style.left = (x + 20) + 'px'; l.style.top = (y + 10) + 'px'; l.style.background = cols[i % 5]; lights.appendChild(l);
    tl.fromTo(l, { opacity: 1 }, { opacity: 0.3, duration: 8 * F, yoyo: true, repeat: 19, ease: 'steps(1)' }, (i % 3) * 3 * F);
  }
  WA.snow(tl, '#xm-snow', { n: 50, seed: 12, speed: 200, drift: -30, size: [8, 16] });
  // the scroll drops in, ribbon and all
  gsap.set('#xm-sheet', { scaleY: 0 });
  tl.fromTo('#xm-scroll', { y: -1300, rotation: -8 }, { y: 0, rotation: 0, duration: 14 * F, ease: 'power2.in' }, 6 * F);
  WA.squash(tl, '#xm-scroll', 20 * F, 0.14, 12);
  tl.to('#xm-scroll', { rotation: 3, duration: 4 * F, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 22 * F);
  WA.shake(tl, '#xm-bow', 30 * F, 10 * F, 4, { grow: 1, seed: 3, rot: 4 });
  // SNAP: the bow flies apart
  tl.set(['#xm-bow', '#xm-band'], { opacity: 0 }, 40 * F);
  WA.word(tl, '#xm-snap', 40 * F, 24, { rot: -6, rot0: 12, seed: 2, amp: 6 });
  var fx = document.getElementById('xm-fx');
  [[-1, -16, -18], [1, 16, -18], [-1, -10, -8], [1, 10, -8]].forEach(function (b, i) {
    var d = document.createElement('div'); d.className = 'xm-bit'; fx.appendChild(d);
    d.innerHTML = '<svg width="120" height="70" viewBox="0 0 120 70"><path d="M10 35 Q60 -10 110 35 Q60 70 10 35 Z" fill="#D9363E" stroke="#341720" stroke-width="8"/></svg>';
    WA.toss(tl, d, 40 * F, { x0: 480, y0: 860, vx: b[1], vy: b[2], g: 1.3, frames: 34, spin: b[0] * 18 });
  });
  // it unrolls
  tl.to('#xm-sheet', { scaleY: 1, duration: 28 * F, ease: 'power2.out' }, 46 * F);
  tl.to('#xm-bottom', { y: 894, duration: 28 * F, ease: 'power2.out' }, 46 * F);
  tl.to('#xm-scroll', { y: -260, duration: 28 * F, ease: 'power2.out' }, 46 * F);
  tl.to('#xm-scroll', { y: 40, scale: 0.78, duration: 10 * F, ease: 'power2.inOut' }, 108 * F);
  WA.confetti(tl, '#xm-fx', 76 * F, 540, 1500, { seed: 4, n: 30, angle: -1.57, spread: 0.9, speed: 34, g: 1.1, frames: 46, colors: ['#D9363E', '#FFD064', '#2F8A5E', '#FFFFFF'] });

  window.__timelines['joke-xmas'] = tl;
})();
</script>
