  // a slow push in on the drawing

  // the gold star swoops in and slaps on

  WA.squash(tl, '#mf-star svg', 44 * F, 0.3, 12);
  gsap.set('#mf-star svg', { transformOrigin: '130px 130px' });
  WA.shake(tl, '#mf-cam', 44 * F, 8 * F, 10, { seed: 2, decay: true });
  WA.word(tl, '#mf-slap', 44 * F, 26, { rot: -8, rot0: 12, seed: 4 });
  [[52, '#mf-s0'], [57, '#mf-s1'], [62, '#mf-s2'], [80, '#mf-s0'], [86, '#mf-s1'], [92, '#mf-s2']].forEach(function (k) {

    tl.to(k[1], { opacity: 0, scale: 0, rotation: 40, duration: 6 * F, ease: 'power1.in' }, (k[0] + 8) * F);
  });

  // mom, off-screen

  WA.bob(tl, '#mf-bubble', 78 * F, 1.4, 8, 0.6);
  ['#mf-h0', '#mf-h1', '#mf-h2'].forEach(function (h, i) {
    tl.fromTo(h, { opacity: 0, y: 0, scale: 0.5 }, { opacity: 1, y: -260, scale: 1, duration: 18 * F, ease: 'power1.out', immediateRender: false }, (84 + i * 5) * F);
    tl.to(h, { opacity: 0, y: -380, duration: 10 * F, ease: 'power1.in' }, (102 + i * 5) * F);
  });

  window.__timelines['joke-fridge'] = tl;
})();
</script>
