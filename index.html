<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Winter Arc</title>
  <meta name="description" content="7 points a week. No excuses. Log workouts with the fellas and stay in the Winter Arc.">
  <meta name="theme-color" content="#8DBCFF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Winter Arc">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preload" href="assets/fonts/luckiest-guy.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/baloo-2-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="booting">
  <div class="sky" aria-hidden="true">
    <span class="cloud c1"></span><span class="cloud c2"></span><span class="cloud c3"></span>
  </div>
  <div class="status-bar-background" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <img src="assets/icons/logo.png" alt="" width="40" height="40">
      <span>WINTER ARC</span>
    </div>
    <div class="top-r">
      <span id="sampleChip" class="sample-chip" hidden>Sample data</span>
      <button id="meBtn" class="me-btn" data-act="account" aria-label="Account and settings" hidden></button>
    </div>
  </header>

  <div id="app">
    <main id="view" tabindex="-1"></main>
  </div>

  <nav class="tabs" aria-label="Main">
    <button data-act="tab" data-tab="home" data-icon="home"><span>Home</span></button>
    <button data-act="tab" data-tab="feed" data-icon="feed"><span>Feed</span></button>
    <button class="fab" data-act="log" aria-label="Log an activity"><span class="fab-in" data-icon="plus"></span></button>
    <button data-act="tab" data-tab="board" data-icon="board"><span>Board</span></button>
    <button data-act="tab" data-tab="me" data-icon="me"><span>Me</span></button>
  </nav>

  <div id="sheet" class="sheet" hidden></div>
  <div id="layer"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="celebrate" class="celebrate" hidden></div>
  <input id="photoInput" type="file" accept="image/*" hidden>

  <dialog id="avatarCrop" class="avatar-crop" aria-labelledby="avatarCropTitle">
    <form method="dialog">
      <h2 id="avatarCropTitle">Crop profile photo</h2>
      <p class="note" id="avatarCropHint">Drag or use the arrow keys to move the photo. Use Zoom to adjust the crop.</p>
      <canvas class="avatar-crop-view" width="480" height="480" tabindex="0" autofocus role="img"
        aria-label="Profile photo crop preview" aria-describedby="avatarCropHint"></canvas>
      <label class="avatar-zoom">Zoom <input type="range" min="1" max="4" step="0.01" value="1"></label>
      <p class="avatar-crop-error" role="alert" hidden></p>
      <div class="mact">
        <button class="btn" type="button">Cancel</button>
        <button class="btn btn-primary" type="submit">Save photo</button>
      </div>
    </form>
  </dialog>

  <!-- order matters: settings, rules, art, data layer, effects, screens -->
  <script src="js/config.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/jokes.js"></script>
  <script src="js/art.js"></script>
  <script src="js/store.js"></script>
  <script src="js/celebrate.js"></script>
  <script src="js/avatar-crop.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
